###############################################
# Nginx - Connec Radio
# Reverse proxy para MediaMTX + servir player web
###############################################

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # Rota de validação Let's Encrypt (para quando tiver domínio)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    server_name _;

    # ───── SSL ─────
    # Certificado auto-assinado (gerado pelo install.sh)
    ssl_certificate     /etc/nginx/ssl/connecradio.crt;
    ssl_certificate_key /etc/nginx/ssl/connecradio.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ───── Headers de segurança ─────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ───── CORS para WebRTC ─────
    add_header Access-Control-Allow-Origin  *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PATCH, DELETE";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-Match";
    add_header Access-Control-Expose-Headers "ETag, Location, Link";

    # ───── Player Web ─────
    root /var/www/connecradio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ───── MediaMTX WebRTC (WHIP / WHEP) ─────
    # Proxy para o MediaMTX na porta 8889

    # WHIP - ingestão do BUTT
    location /whip/ {
        proxy_pass http://127.0.0.1:8889/whip/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para SDP offer/answer (POST com resposta)
        proxy_request_buffering off;
        proxy_buffering off;

        # Timeout longo para conexões WebRTC
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # OPTIONS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PATCH, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-Match";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # WHEP - playback para ouvintes
    location /whep/ {
        proxy_pass http://127.0.0.1:8889/whep/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PATCH, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-Match";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # API MediaMTX (somente localhost - bloqueado externamente)
    # location /api/ {
    #     deny all;
    # }
}
