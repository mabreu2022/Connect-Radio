###############################################
# coturn - STUN/TURN server - Connec Radio
###############################################

# Porta STUN/TURN padrão
listening-port=3478

# Porta TLS (TURNS)
tls-listening-port=5349

# IP público do servidor (substituído pelo install.sh)
external-ip=SERVER_IP_PLACEHOLDER

# Escutar em todas as interfaces
listening-ip=0.0.0.0

# Faixa de portas UDP para relay de mídia
min-port=49152
max-port=65535

# Realm (identificador do servidor)
realm=connecradio.local

# Credenciais de acesso (substituídas pelo install.sh)
user=connecradio:TURN_PASSWORD_PLACEHOLDER

# Modo de autenticação por tempo (mais seguro)
use-auth-secret
static-auth-secret=TURN_SECRET_PLACEHOLDER

# Desabilitar DTLS antigo
no-dtls

# Habilitar apenas relay UDP e TCP
no-multicast-peers

# Log
log-file=/var/log/coturn/turnserver.log
verbose

# Desabilitar CLI (segurança)
no-cli

# Certificado TLS (auto-assinado inicialmente)
cert=/etc/nginx/ssl/connecradio.crt
pkey=/etc/nginx/ssl/connecradio.key
